name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security:
    uses: chopdawginc/ci-security-perf/.github/workflows/security.yml@v1.0.1
    with:
      platform: web
      firebase: true
      functions-dir: functions

  performance:
    uses: chopdawginc/ci-security-perf/.github/workflows/performance.yml@v1.0.1
    with:
      platform: web
      build-command: npm run build
      dist-dir: build
      # Current authenticated admin baseline is ~2130 KB; fail on material growth.
      bundle-budget-kb: 2250
      lighthouse: true
      node-version: "22"

  quality:
    name: App lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (advisory while template debt is cleared)
        continue-on-error: true
        run: npm run lint
      - name: Typecheck (advisory while MUI Grid is migrated)
        continue-on-error: true
        run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  rules-test:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix rules-tests
      - run: npx --yes firebase-tools emulators:exec --only firestore --project demo-rules-test "node --test rules-tests/"

  functions-build:
    name: Functions typecheck/build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
