name: Deploy verification

on:
  workflow_dispatch:

jobs:
  verify:
    # Template stub: enable after configuring FIREBASE_SERVICE_ACCOUNT and a
    # non-production Firebase project for post-deploy smoke tests.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy hosting to the verification project
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npx --yes firebase-tools deploy --only hosting --project verification
      - name: Verify deployed endpoint
        run: curl --fail --retry 5 --retry-delay 5 "$VERIFY_URL"
        env:
          VERIFY_URL: ${{ vars.VERIFY_URL }}
